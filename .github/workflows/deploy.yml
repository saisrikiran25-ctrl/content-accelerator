name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Using inline values since these are public anon keys (safe to expose)
          # These values are from the .env file which is already in the repository
          VITE_SUPABASE_URL: "https://qharssnwpweoiderjylv.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoYXJzc253cHdlb2lkZXJqeWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5NTU2NjcsImV4cCI6MjA4NDUzMTY2N30.EZ3ybieLZcH94QQtNvBHJZeQNeTiL6eXfbpghp6U7Ok"
          VITE_SUPABASE_PROJECT_ID: "qharssnwpweoiderjylv"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
